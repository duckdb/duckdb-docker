name: Deploy to Docker Hub
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Docker image name.
        type: string
        required: true
        default:  'duckdb/duckdb'
      duckdb_version:
        description: DuckDB version to deploy. Without leading 'v'!
        type: string
        required: true
      set_as_latest:
        description: Set this version as the 'latest' on Docker?
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ inputs.image_name }}
  TEST_TAG: ${{ inputs.image_name }}:test
  LATEST_TAG: ${{ inputs.image_name }}:latest
  VER: ${{ inputs.duckdb_version }}
  VER_TAG: ${{ inputs.image_name }}:${{ inputs.duckdb_version }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Download DuckDB binaries
        shell: bash
        run: |
          for arch in amd64 arm64; do
            output="duckdb_${arch}"
            if [[ "$VER" == 1.* ]]; then
              archive="duckdb_cli-linux-${arch}.zip"
              curl --fail --silent --show-error --location \
                "https://install.duckdb.org/v$VER/$archive" \
                --output "$archive"
              unzip -p "$archive" duckdb > "$output"
            else
              curl --fail --silent --show-error --location \
                "https://install.duckdb.org/v$VER/duckdb-cli-linux-${arch}.tar.gz" |
                tar -xzO duckdb > "$output"
            fi
          done
          chmod +x duckdb_*
          ls -l duckdb_*

      - name: Create Dockerfile
        shell: bash
        run: |
         cat > Dockerfile <<- EOM
         FROM gcr.io/distroless/cc-debian12
         ARG TARGETPLATFORM
         ARG TARGETARCH
         COPY duckdb_\$TARGETARCH /duckdb
         CMD ["/duckdb"]
         ENV PATH="\$PATH:/"
         EOM

      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}

      - name: Test
        run: |
          REPORTED_VER=$(docker run --rm "${{ env.TEST_TAG }}" duckdb -csv -noheader -c "SELECT version()")

          if [ "$REPORTED_VER" != "v$VER" ]
          then
            echo "Failed version check for $VER, got $REPORTED_VER"
            exit 1
          fi

      - name: Build and push ${{ inputs.duckdb_version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.VER_TAG }}


      - name: Build and push latest
        if: ${{ inputs.set_as_latest }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.LATEST_TAG }}
